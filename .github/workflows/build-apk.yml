name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Release v$VERSION already exists, only building"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VERSION, a release will be published"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the web part
        run: npm run build

      - name: Copy the web part into the project
        run: npx cap sync android

      - name: Restore the signing key
        if: github.repository == 'mirendex/wordos'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        if: github.repository == 'mirendex/wordos'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK as artifact
        if: github.repository == 'mirendex/wordos'
        uses: actions/upload-artifact@v4
        with:
          name: wordos-${{ steps.version.outputs.version }}-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Name the APK after the version
        if: github.repository == 'mirendex/wordos' && steps.version.outputs.release == 'true' && github.ref_name == github.event.repository.default_branch
        run: cp android/app/build/outputs/apk/release/app-release.apk "wordos-${{ steps.version.outputs.version }}.apk"

      - name: Write the release notes
        if: github.repository == 'mirendex/wordos' && steps.version.outputs.release == 'true' && github.ref_name == github.event.repository.default_branch
        run: |
          # the commits since the previous version, which the app shows in its update dialog
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          git log --no-merges --format='- %s' "$RANGE" | grep -v -E '^- Release ' | head -n 30 > notes.md
          [ -s notes.md ] || echo "- Version ${{ steps.version.outputs.version }}" > notes.md
          cat notes.md

      - name: Create the GitHub release
        if: github.repository == 'mirendex/wordos' && steps.version.outputs.release == 'true' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WordOS ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: wordos-${{ steps.version.outputs.version }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
